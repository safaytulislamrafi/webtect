<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bright Future | Contact</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Same navigation bar as the other pages -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">Bright Future</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h1 class="section-title">Contact Us</h1>
        <div class="row g-4">
            <div class="col-md-5">
                <div class="contact-info">
                    <h2>Get in Touch</h2>
                    <p>Have a question or an idea? Send us a message.</p>
                    <p><strong>Email:</strong> hello@brightfuture.com</p>
                    <p><strong>Phone:</strong> +880 1234 567890</p>
                    <p><strong>Address:</strong> Dhaka, Bangladesh</p>
                </div>
            </div>
            <div class="col-md-7">
                <!-- Frontend-only form: it does not send data anywhere yet -->
                <form class="contact-form">
                    <div class="mb-3"><label for="name" class="form-label">Name</label><input type="text" class="form-control" id="name" placeholder="Enter your name"></div>
                    <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" class="form-control" id="email" placeholder="Enter your email"></div>
                    <div class="mb-3"><label for="subject" class="form-label">Subject</label><input type="text" class="form-control" id="subject" placeholder="Enter a subject"></div>
                    <div class="mb-3"><label for="message" class="form-label">Message</label><textarea class="form-control" id="message" rows="5" placeholder="Write your message"></textarea></div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer text-center"><p class="mb-0">&copy; 2026 Bright Future. Student Web Technology Project.</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
