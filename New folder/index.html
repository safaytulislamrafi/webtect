<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Test Page</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #222;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
      }

      .card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        max-width: 600px;
        width: 100%;
        padding: 30px;
      }

      h1 {
        margin-top: 0;
        color: #1e3a8a;
      }

      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background: #1d4ed8;
      }

      #message {
        margin-top: 20px;
        font-weight: bold;
        color: #0f766e;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Test Page</h1>
      <p>This is a simple HTML page for testing.</p>
      <button id="testButton">Click Me</button>
      <div id="message"></div>
    </div>

    <script>
      document.getElementById('testButton').addEventListener('click', function () {
        document.getElementById('message').textContent = 'Button clicked successfully!';
      });
    </script>
  </body>
</html>
